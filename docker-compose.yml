version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: fraud_redis
    ports:
      - "6379:6379"
    restart: always

  fraud_api:
    build: .
    container_name: fraud_api_service
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
    restart: always