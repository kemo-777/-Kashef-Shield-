<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>درع كاشف | Kashef Shield Enterprise</title>
  <style>
    :root {
      --bg: #030712;
      --card: #080f24;
      --card-hover: #0c1738;
      --text: #00f2fe;
      --text-muted: #64748b;
      --border: #00f2fe;
      --accent: #38bdf8;
      --shadow: 0 0 20px rgba(0, 242, 254, 0.25);
      --success: #22c55e;
      --warning: #eab308;
      --danger: #ef4444;
    }

    body.light {
      --bg: #f8fafc;
      --card: #ffffff;
      --card-hover: #f1f5f9;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --accent: #0284c7;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
      --success: #16a34a;
      --warning: #ca8a04;
      --danger: #dc2626;
    }

    body.dark {
      --bg: #0b0f19;
      --card: #111827;
      --card-hover: #1f2937;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --accent: #38bdf8;
      --shadow: none;
      --success: #22c55e;
      --warning: #eab308;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
    }

    .header-info h1 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .header-info p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .controls {
      display: flex;
      gap: 8px;
    }

    select, button, input, textarea {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 8px;
      outline: none;
      font-size: 14px;
      transition: border-color 0.2s;
    }

    select:focus, input:focus, textarea:focus {
      border-color: var(--accent);
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }

    .metric-card {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 16px;
      border-radius: 12px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .metric-card h3 {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .metric-card p {
      font-size: 28px;
      font-weight: 800;
      color: var(--accent);
    }

    .tabs {
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .tab-btn {
      cursor: pointer;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text);
      padding: 10px 18px;
      font-weight: 700;
      border-radius: 8px;
      opacity: 0.6;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--card);
      border-color: var(--border);
      opacity: 1;
      box-shadow: var(--shadow);
    }

    .tab-content {
      display: none;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: var(--shadow);
    }

    .tab-content.active {
      display: block;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 768px) {
      .grid-2 { grid-template-columns: 1fr; }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }

    .form-group label {
      font-size: 13px;
      font-weight: 600;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      background: var(--accent);
      color: #030712;
      border: none;
      border-radius: 8px;
      margin-top: 10px;
      transition: transform 0.1s ease, filter 0.2s ease;
    }

    .btn-submit:hover {
      filter: brightness(1.1);
    }

    .btn-submit:active {
      transform: scale(0.99);
    }

    .result-box {
      margin-top: 16px;
      padding: 16px;
      border-radius: 8px;
      display: none;
      font-size: 14px;
      line-height: 1.6;
    }

    .status-pass {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid var(--success);
      color: var(--success);
    }

    .status-warn {
      background: rgba(234, 179, 8, 0.1);
      border: 1px solid var(--warning);
      color: var(--warning);
    }

    .status-fail {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--danger);
      color: var(--danger);
    }

    .log-table-wrapper {
      margin-top: 20px;
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: inherit;
      font-size: 13px;
    }

    th, td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    th {
      background: var(--card-hover);
      color: var(--text-muted);
      font-weight: 700;
    }
  </style>
</head>

    let stats = { total: 0, pass: 0, otp: 0, block: 0 };

    // التبديل بين التبويبات
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      event.target.classList.add('active');
    }

    // تبديل المظهر
    document.getElementById('theme-select').addEventListener('change', (e) => {
      document.body.className = e.target.value;
    });

    // تبديل اللغة وتحديث النصوص والاتجاه
    document.getElementById('lang-select').addEventListener('change', (e) => {
      const code = e.target.value;
      const t = I18N[code] || I18N.en;
      document.documentElement.dir = t.dir;
      document.documentElement.lang = code;

      document.getElementById('app-title').innerText = t.title;
      document.getElementById('app-sub').innerText = t.sub;
      document.getElementById('t-tx').innerText = t.t_tx;
      document.getElementById('t-call').innerText = t.t_call;
      document.getElementById('btn-eval').innerText = t.btn_eval;
      document.getElementById('btn-call').innerText = t.btn_call;
      document.getElementById('lbl-total').innerText = t.total;
      document.getElementById('lbl-pass').innerText = t.pass;
      document.getElementById('lbl-otp').innerText = t.otp;
      document.getElementById('lbl-block').innerText = t.block;
    });

    // توليد توقيع تشفيري للعملية
    async function generateHMACSignature(msg) {
      const enc = new TextEncoder();
      const key = await crypto.subtle.importKey(
        "raw",
        enc.encode("kashef_shield_secure_key_2026"),
        { name: "HMAC", hash: "SHA-256" },
        false,
        ["sign"]
      );
      const signature = await crypto.subtle.sign("HMAC", key, enc.encode(msg));
      return Array.from(new Uint8Array(signature)).map(b => b.toString(16).padStart(2, '0')).join('').substring(0, 16);
    }

    // حجب أرقام البطاقة PCI-DSS
    function maskCard(card) {
      const clean = card.replace(/\D/g, '');
      if (clean.length < 4) return "****";
      return "****-****-****-" + clean.slice(-4);
    }

    // فحص المعاملات
    async function evaluateTx() {
      const uid = document.getElementById('tx-user').value;
      const amt = parseFloat(document.getElementById('tx-amt').value) || 0;
      const card = document.getElementById('tx-card').value;
      const country = document.getElementById('tx-country').value;
      const resBox = document.getElementById('tx-result');

      stats.total++;
      let decision = "APPROVE";
      let riskScore = 5.0;
      let reason = "سلوك طبيعي يطابق الملف المالي للعميل";

      if (country === "UNKNOWN") {
        decision = "BLOCKED";
        riskScore = 99.9;
        reason = "معاملة قادمة من نطاق محظور ومدرج في القائمة السوداء الدولية";
      } else if (amt > 2500) {
        decision = "BLOCKED";
        riskScore = 96.5;
        reason = "انحراف قياسي ضخم في المبلغ المسحوب (High Value Anomaly)";
      } else if (amt > 600) {
        decision = "CHALLENGE_OTP";
        riskScore = 48.0;
        reason = "مبلغ يستدعي مصادقة ثنائية لتقليل المخاطر الاحترازية";
      }

      resBox.style.display = 'block';
      if (decision === "BLOCKED") {
        stats.block++;
        resBox.className = 'result-box status-fail';
        resBox.innerHTML = `🚫 <b>تم حظر المعاملة فوراً!</b><br>مستوى الخطر: ${riskScore}%<br>السبب: ${reason}`;
      } else if (decision === "CHALLENGE_OTP") {
        stats.otp++;
        resBox.className = 'result-box status-warn';
        resBox.innerHTML = `⚠️ <b>مطلوب رمز تحقق (OTP)!</b><br>مستوى الخطر: ${riskScore}%<br>السبب: ${reason}`;
      } else {
        stats.pass++;
        resBox.className = 'result-box status-pass';
        resBox.innerHTML = `✅ <b>تمت الموافقة وتمرير المعاملة بأمان!</b><br>مستوى الخطر: ${riskScore}%<br>السبب: ${reason}`;
      }

      // إضافة السجل والتوقيع الرقمي
      const sig = await generateHMACSignature(`${uid}_${amt}_${decision}`);
      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${new Date().toLocaleTimeString()}</td>
        <td>#${uid}</td>
        <td>${maskCard(card)}</td>
        <td>${riskScore}%</td>
        <td><b>${decision}</b></td>
        <td><code>${sig}</code></td>
      `;
      document.getElementById('tx-log-body').prepend(row);

      updateMetrics();
    }

    // فحص المكالمات
    function evaluateCall() {
      const phone = document.getElementById('call-phone').value;
      const text = document.getElementById('call-txt').value.toLowerCase();
      const resBox = document.getElementById('call-result');

      const keywords = ["فيزا", "بطاقة", "otp", "كود", "تحقق", "موقوف", "تحديث", "cvv", "البنك المركزي", "سري", "card", "password"];
      const matches = keywords.filter(k => text.includes(k));
      const hasNumbers = /\d{4,16}/.test(text);

      let risk = matches.length * 20 + (hasNumbers ? 30 : 0);
      risk = Math.min(100, risk);

      resBox.style.display = 'block';
      if (risk >= 60) {
        resBox.className = 'result-box status-fail';
        resBox.innerHTML = `🚨 <b>تم رصد هجوم هندسة اجتماعية حرج (Vishing Attack)!</b><br>الإجراء: إنهاء المكالمة وإدراج الرقم <code>${phone}</code> في القائمة السوداء الدولية.<br>نسبة الخطر: ${risk}% | الكلمات المرصودة: ${matches.join(', ')}`;
      } else if (risk >= 30) {
        resBox.className = 'result-box status-warn';
        resBox.innerHTML = `⚠️ <b>تنبيه اشتباه احتيال صوتي:</b> تجري محاولة طلب بيانات شبه حساسة.<br>نسبة الخطر: ${risk}% | الكلمات المرصودة: ${matches.join(', ')}`;
      } else {
        resBox.className = 'result-box status-pass';
        resBox.innerHTML = `✅ <b>مكالمة آمنة وطبيعية:</b> لم يتم رصد أي محاولات استدراج بيانات.<br>نسبة الخطر: ${risk}%`;
      }
    }

    function updateMetrics() {
      document.getElementById('cnt-total').innerText = stats.total;
      document.getElementById('cnt-pass').innerText = stats.pass;
      document.getElementById('cnt-otp').innerText = stats.otp;
      document.getElementById('cnt-block').innerText = stats.block;
    }
  </script>
</body>
</html>
